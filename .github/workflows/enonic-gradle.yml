name: Gradle Build

on: [ push, workflow_dispatch ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing of @enonic-types/lib-graphql
    outputs:
      release: ${{ steps.build-and-publish.outputs.release }}
    steps:
      - id: build-and-publish
        uses: enonic/release-tools/build-and-publish@master
        with:
          repoUser: ci
          repoPassword: ${{ secrets.ARTIFACTORY_PASSWORD }}
          npmPublish: true
          releaseBranch: |
            3.x
            master

  release:
    runs-on: ubuntu-latest

    needs: build
    if: needs.build.outputs.release == 'true'

    permissions:
      contents: write # tag, GitHub release, next-SNAPSHOT commit
      actions: write # `gh workflow run` for the SNAPSHOT build
      issues: read # changelog generation
      pull-requests: read

    steps:
      - uses: enonic/release-tools/release@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
